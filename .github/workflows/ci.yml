name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libssl-dev \
            binutils-arm-none-eabi

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --target wasm32-unknown-unknown

      - name: Build fixtures
        run: |
          cargo run --locked -p gba-tools -- build-fixtures
          git diff --exit-code -- roms

      - name: Install Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '26.10.0'

      - name: Advanced display contracts
        run: |
          python3 roms/affine/build.py
          python3 roms/affine-object/build.py
          python3 roms/window/build.py

          git diff --exit-code -- \
            roms/affine-mode-1.gba \
            roms/affine-mode-2.gba \
            roms/affine-mode-3.gba \
            roms/affine-mode-4.gba \
            roms/affine-mode-5.gba \
            roms/affine-object.gba \
            roms/affine-object-degenerate.gba \
            roms/window.gba

          python3 roms/affine/verify.py
          python3 roms/affine-object/verify.py
          python3 roms/window/verify.py

      - name: WASM timing runtime
        run: |
          python3 roms/cartridge/verify_wasm.py --diagnostics --vblank --keypad --dma --pcm
          node --check web/audio.js
          node --check web/pcm-worklet.js

      - name: Backup contracts
        run: |
          python3 roms/backup/verify.py
          python3 roms/sram/verify.py
          python3 roms/flash/verify.py
          python3 roms/flash-banked/verify.py
          python3 roms/eeprom/verify.py

      - name: PSG audio contracts
        run: |
          python3 roms/pulse/verify.py
          python3 roms/wave/verify.py
          python3 roms/noise/verify.py

      - name: Formatting
        run: |
          cargo fmt --all -- --check

      - name: Workspace tests
        run: cargo test --locked --workspace

      - name: Native persistence reopen
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT

          GBA_SAVE_DIR="$ROOT/sram" \
            cargo run --locked -p gba-app --release -- --save-probe write
          GBA_SAVE_DIR="$ROOT/sram" \
            cargo run --locked -p gba-app --release -- --save-probe read

          GBA_SAVE_DIR="$ROOT/flash" \
            cargo run --locked -p gba-app --release -- --save-probe flash-write
          GBA_SAVE_DIR="$ROOT/flash" \
            cargo run --locked -p gba-app --release -- --save-probe flash-read

          GBA_SAVE_DIR="$ROOT/flash128" \
            cargo run --locked -p gba-app --release -- --save-probe banked-write
          GBA_SAVE_DIR="$ROOT/flash128" \
            cargo run --locked -p gba-app --release -- --save-probe banked-read

          GBA_SAVE_DIR="$ROOT/eeprom512" \
            cargo run --locked -p gba-app --release -- --save-probe eeprom512-write
          GBA_SAVE_DIR="$ROOT/eeprom512" \
            cargo run --locked -p gba-app --release -- --save-probe eeprom512-read

          GBA_SAVE_DIR="$ROOT/eeprom8k" \
            cargo run --locked -p gba-app --release -- --save-probe eeprom8k-write
          GBA_SAVE_DIR="$ROOT/eeprom8k" \
            cargo run --locked -p gba-app --release -- --save-probe eeprom8k-read

      - name: Headless fixture
        run: |
          cargo run --locked -p gba-tools --release -- \
            fixtures run \
            --manifest fixtures/manifest.toml

      - name: Clippy
        run: |
          cargo clippy \
            --locked \
            --workspace \
            --all-targets \
            -- \
            -D warnings

      - name: WASM compile
        run: |
          cargo check \
            --locked \
            -p gba-app \
            --target wasm32-unknown-unknown

      - name: Install Trunk
        run: |
          cargo install \
            --locked \
            trunk \
            --version 0.21.14

      - name: Browser release build
        run: |
          trunk \
            --config web/Trunk.toml \
            build \
            --release

[package]
name = "gba-app"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }

# Keep native Linux window backends limited to Linux builds.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["x11", "wayland"] }

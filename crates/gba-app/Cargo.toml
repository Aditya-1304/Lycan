[package]
name = "gba-app"
version = "0.1.0"
edition = "2024"

[dependencies]
gba-core = { path = "../gba-core" }
gba-session = { path = "../gba-session" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }

# Keep native Linux window backends limited to Linux builds.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
